name: Deploy to AWS S3

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Create ZIP Deployment Package
      run: zip -r deploy_package.zip application.py requirements.txt templates/

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-1

    - name: Copy Deployment Package to S3
      run: aws s3 cp deploy_package.zip s3://surge-072468084963-ap-southeast-1-an/deploy_package.zip

    - name: Create or update Elastic Beanstalk application and environment
      run: |
        set -euo pipefail

        APP_NAME="surge-app"
        ENV_NAME="Surge-app-env"
        VERSION_LABEL="ver-${{ github.sha }}"
        S3_BUCKET="surge-072468084963-ap-southeast-1-an"
        S3_KEY="deploy_package.zip"

        APP_EXISTS=$(aws elasticbeanstalk describe-applications --application-names "$APP_NAME" --query 'Applications[0].ApplicationName' --output text 2>/dev/null || echo "None")
        if [ "$APP_EXISTS" = "None" ]; then
          echo "Application '$APP_NAME' not found. Creating it..."
          aws elasticbeanstalk create-application --application-name "$APP_NAME" --description "Surge app"
        else
          echo "Application '$APP_NAME' already exists."
        fi

        aws elasticbeanstalk create-application-version \
          --application-name "$APP_NAME" \
          --version-label "$VERSION_LABEL" \
          --source-bundle S3Bucket="$S3_BUCKET",S3Key="$S3_KEY"

        ENV_STATUS=$(aws elasticbeanstalk describe-environments --application-name "$APP_NAME" --environment-names "$ENV_NAME" --include-deleted --query 'Environments[0].Status' --output text 2>/dev/null || echo "None")
        if [ "$ENV_STATUS" = "None" ]; then
          echo "Environment '$ENV_NAME' not found. Creating it..."
          SOLUTION_STACK_NAME=$(aws elasticbeanstalk list-available-solution-stacks --output json | jq -r '.SolutionStacks | map(select(contains("64bit Amazon Linux 2023") and contains("Python 3.12"))) | .[0] // empty')
          if [ -z "$SOLUTION_STACK_NAME" ]; then
            SOLUTION_STACK_NAME=$(aws elasticbeanstalk list-available-solution-stacks --output json | jq -r '.SolutionStacks | map(select(contains("64bit Amazon Linux 2023") and contains("Python"))) | .[0] // empty')
          fi
          if [ -z "$SOLUTION_STACK_NAME" ]; then
            echo "ERROR: No supported Python solution stack found."
            exit 1
          fi
          echo "Using solution stack: $SOLUTION_STACK_NAME"
          aws elasticbeanstalk create-environment \
            --application-name "$APP_NAME" \
            --environment-name "$ENV_NAME" \
            --version-label "$VERSION_LABEL" \
            --solution-stack-name "$SOLUTION_STACK_NAME"
        else
          echo "Environment '$ENV_NAME' exists (status: $ENV_STATUS). Updating it..."
          aws elasticbeanstalk update-environment \
            --environment-name "$ENV_NAME" \
            --version-label "$VERSION_LABEL"
        fi
