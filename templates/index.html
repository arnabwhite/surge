<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sederhana URL Shortener</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background-color: #f4f4f9; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #333; margin-bottom: 1rem; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 20px; padding: 10px; border-top: 1px solid #eee; display: none; }
        .short-url { font-weight: bold; color: #007bff; word-break: break-all; }
    </style>
</head>
<body>

<div class="container">
    <h2>URL Shortener</h2>
    <input type="url" id="longUrl" placeholder="Masukkan URL panjang di sini (https://...)" required>
    <button onclick="shorten()">Perpendek URL</button>

    <div id="result">
        <p>Hasil URL Pendek:</p>
        <a id="shortLink" class="short-url" href="#" target="_blank"></a>
    </div>
</div>

<script>
    async function shorten() {
        const longUrl = document.getElementById('longUrl').value;
        const resultDiv = document.getElementById('result');
        const shortLink = document.getElementById('shortLink');

        if (!longUrl) {
            alert("Silakan masukkan URL terlebih dahulu!");
            return;
        }

        try {
            const response = await fetch('/shorten', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ long_url: longUrl })
            });

            const data = await response.json();

            if (response.ok) {
                // Tampilkan hasil
                resultDiv.style.display = 'block';
                shortLink.href = data.short_url;
                shortLink.innerText = data.short_url;
            } else {
                alert("Error: " + data.error);
            }
        } catch (err) {
            console.error(err);
            alert("Gagal menghubungi server.");
        }
    }
</script>

</body>
</html>
