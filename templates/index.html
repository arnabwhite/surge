<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SURGE_PROTOCOL // URL_SHORTENER</title>
    <style>
        /* Estetika Web Lama & Dark Web */
        body {
            background-color: #0d0d0d;
            color: #1ed760; /* Hijau Terminal */
            font-family: "Courier New", Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-transform: uppercase;
        }

        .container {
            border: 2px solid #1ed760;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            background-color: #1a1a1a;
            box-shadow: 5px 5px 0px #005f27;
        }

        h2 {
            border-bottom: 2px solid #1ed760;
            padding-bottom: 10px;
            margin-top: 0;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        .input-group {
            margin-top: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.8rem;
        }

        input {
            width: 100%;
            background-color: #000;
            border: 1px solid #1ed760;
            color: #1ed760;
            padding: 10px;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 15px;
        }

        input:focus {
            background-color: #0a2a14;
        }

        button {
            width: 100%;
            background-color: #1ed760;
            color: #000;
            border: none;
            padding: 10px;
            font-family: "Courier New", Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #15a34a;
        }

        #result {
            margin-top: 20px;
            padding: 10px;
            border: 1px dashed #1ed760;
            display: none;
            background-color: #000;
        }

        .short-url {
            color: #fff;
            text-decoration: underline;
            word-break: break-all;
        }

        .footer {
            margin-top: 15px;
            font-size: 0.6rem;
            color: #005f27;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>[ COMMAND_CENTER : SHORTEN_URL ]</h2>
    
    <div class="input-group">
        <label for="longUrl">> ENTER_LONG_URL_TARGET:</label>
        <input type="url" id="longUrl" placeholder="HTTP://ANYWHERE.COM/LONG-ID-123" required>
        
        <button onclick="shorten()">GENERATE_SHORT_LINK</button>
    </div>

    <div id="result">
        <p>> OUTPUT_LINK_GENERATED:</p>
        <a id="shortLink" class="short-url" href="#" target="_blank"></a>
    </div>

    <div class="footer">
        STATUS: ENCRYPTED // VERSION: 1.0.42
    </div>
</div>

<script>
    async function shorten() {
        const longUrl = document.getElementById('longUrl').value;
        const resultDiv = document.getElementById('result');
        const shortLink = document.getElementById('shortLink');

        if (!longUrl) {
            alert("SYSTEM ERROR: INPUT_NULL");
            return;
        }

        try {
            const response = await fetch('/shorten', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ long_url: longUrl })
            });

            const data = await response.json();

            if (response.ok) {
                resultDiv.style.display = 'block';
                shortLink.href = data.short_url;
                shortLink.innerText = data.short_url.toUpperCase();
            } else {
                alert("ACCESS_DENIED: " + data.error);
            }
        } catch (err) {
            console.error(err);
            alert("CONNECTION_LOST: SERVER_UNREACHABLE");
        }
    }
</script>

</body>
</html>
